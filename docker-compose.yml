services:
  # -----------------------------
  # Fabric MCP Gateway (external Postgres + external Redis)
  # -----------------------------
  fabric-gateway:
    build: .
    container_name: fabric-mcp-server
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - FABRIC_TRANSPORT=${FABRIC_TRANSPORT:-http}
      - FABRIC_PORT=${FABRIC_PORT:-8000}
      - FABRIC_CONFIG=${FABRIC_CONFIG:-agents.yaml}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - USE_POSTGRES=${USE_POSTGRES:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

    volumes:
      - ./agents.yaml:/app/agents.yaml:ro
      - ./logs:/app/logs

    networks:
      - fabric-network

    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # -----------------------------
  # Observability (optional)
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: fabric-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - fabric-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fabric-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - fabric-network
    profiles:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  fabric-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
